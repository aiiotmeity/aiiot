{% extends "admin/base.html" %}
{% load i18n static %}

{% block title %}{{ site_title|default:_('AI-IoT Admin') }}{% endblock %}

{% block branding %}
  <a href="{% url 'admin:index' %}" style="display:flex;align-items:center;gap:0.75rem;text-decoration:none;color:inherit;">
    <img src="{% static 'logo/logo.png' %}" alt="{{ site_header|default:_('AI-IoT Dashboard') }}" style="height:36px;width:auto;display:block;" />
    <div style="display:flex;flex-direction:column;line-height:1;">
      <strong style="font-size:1rem;">{{ site_header|default:_('AI-IoT Dashboard') }}</strong>
      <small style="font-size:0.75rem;color:rgba(0,0,0,0.6);">Admin</small>
    </div>
  </a>
{% endblock %}
